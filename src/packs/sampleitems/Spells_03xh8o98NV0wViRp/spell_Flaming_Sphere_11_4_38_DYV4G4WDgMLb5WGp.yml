                        ui.notifications.error(`${rolledItem.name} can't get actor to summon`);
                        return false;
                    }
                    if (sphereActorUuid !== profiles[0].uuid) { // had to create an actor so update the summoning profile
                        profiles[0].uuid = sphereActorUuid;
                        await rolledItem.update({"system.summons.profiles": profiles})
                    }
