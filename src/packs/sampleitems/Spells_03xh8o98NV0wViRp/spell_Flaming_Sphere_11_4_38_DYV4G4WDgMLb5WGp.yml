system:
  description:
    value: "<p style=\"box-sizing:border-box;user-select:text;line-height:1.4;color:#191813;font-size:13px\">A 5-foot-diameter Sphere of fire appears in an unoccupied space of your choice within range and lasts for the Duration. Any creature that ends its turn within 5 feet of the sp⁠here must make a Dexterity saving throw. The creature takes 2d6 fire damage on a failed save, or half as much damage on a successful one.</p><p style=\"box-sizing:border-box;user-select:text;line-height:1.4;color:#191813;font-size:13px\">As a Bonus Action, you can move the Sphere up to 30 feet. If you ram the sphe⁠re into a creature, that creature must make the saving throw against the sphere’s damage, and the sp⁠here stops moving this turn.</p><p style=\"box-sizing:border-box;user-select:text;line-height:1.4;color:#191813;font-size:13px\">When you move the Sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. The sp⁠here ignites flammable Objects not being worn or carried, and it sheds bright light in a 20-foot radius and dim light for an additional 20 feet.</p><p style=\"box-sizing:border-box;user-select:text;line-height:1.4;color:#191813;font-size:13px\"><strong style=\"box-sizing:border-box;user-select:text\">At Higher Levels.</strong>\_When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d6 for each slot level above 2nd.</p><p style=\"box-sizing:border-box;user-select:text;line-height:1.4;color:#191813;font-size:13px\"><strong>MidiQol</strong> Will summon the flaming sphere actor (and create such an actor if one does not exist).  Can be renamed.</p><p style=\"box-sizing:border-box;user-select:text;line-height:1.4;color:#191813;font-size:13px\">Requies active auras and dnd5e summon.</p><p></p>"
