  walledtemplates:
    wallsBlock: globalDefault
    wallRestriction: globalDefault
    attachToken: caster
  templatemacro:
    whenCreated:
      asGM: false
      command: >
        const itemUuid = getProperty(template, "flags.midi-qol.itemUuid");

        const item = fromUuidSync(itemUuid);

        const api = game.modules.get("templatemacro").api;


        // Allow selection of tokens that are immune to the effects

        await MidiQOL.resolveLateTargeting(item, {title: "Preselect Immune
        Tokens", forceDisplay: true, clearWorkflowTargets: false});

        const preSelectedTargets = Array.from(game.user.targets).map(token =>
        token.id);

        if (!token) token = MidiQOL.tokenForActor(item.parent);

        if (!preSelectedTargets.includes(token.id))
        preSelectedTargets.push(token.id)


        // seems to take a while to settle down

        await new Promise(resolve => setTimeout(resolve,250));


        let targets;

        // find token covered by the template

        const theTemplate = fromUuidSync(template.uuid);

        if (game.modules.get("walledtemplates")?.active)
          targets = theTemplate.object.targetsWithinShape().map(t => t.id);
        else 
          targets = api.findContained(theTemplate);

        targets = targets.filter(tid => !preSelectedTargets.includes(tid));

        targets = targets.filter(tid =>
        MidiQOL.isTargetable(canvas.scene.tokens.get(tid)));

        await theTemplate.setFlag("midi-qol", "targets", targets);

        await theTemplate.setFlag("midi-qol", "preSelectedTargets",
        preSelectedTargets);


        // record the spell level that Spirit Guardians was cast with

        const workflow = MidiQOL.Workflow.getWorkflow(itemUuid); // fetch the
        cast spell level

        await template.setFlag("midi-qol", "spellLevel", workflow.itemLevel);


        // Apply effects to tokens withing the template

        await theTemplate.callMacro("never", {template: theTemplate, action:
        "doEffects", targetsToAdd: targets, userId: game.user.id});
    whenDeleted:
      asGM: false
      command: >-
        // Remove effects from all targets affected by the template

        const theItem = await fromUuid(template.flags["midi-qol"].itemUuid);

        await template.callMacro("never", {template, action: "doEffects",
        targetsToRemove: template.getFlag("midi-qol", "targets") ?? [], userId:
        game.user.id});
    never:
      asGM: false
      command: >-
        let { action, targetsToAdd, targetsToRemove, targetsToAttack, template }
        = this;

        const preSelected = getProperty(template,
        "flags.midi-qol.preSelectedTargets") ?? [];

        const theItem = await fromUuid(template.flags["midi-qol"].itemUuid);

        let targetTokens;


        switch (action) {
            case "doEffects":
                targetTokens = (targetsToAdd ?? [])
                    .filter(tid => !preSelected.includes(tid))
                    .map(id => canvas.scene.tokens.get(id))
                    .filter(t => t)
                if (targetTokens?.length > 0) await DAE.doEffects(theItem, true, targetTokens, { applyAll: true, selfEffects: "none", whisper: false });
                targetTokens = (targetsToRemove ?? [])
                    .filter(tid => !preSelected.includes(tid))
                    .map(id => canvas.scene.tokens.get(id))
                    .filter(t => t);
                if (targetTokens?.length > 0) DAE.deleteItemActiveEffects(targetTokens, theItem.uuid, [], [], false);
                break;
            case "doAttack":
                const actor = theItem.parent;
                let damageType = "radiant";
                const alignment = actor.system.details.alignment.toLocaleLowerCase();
                if (alignment.includes("evil")) damageType = "necrotic";
                const spellLevel = template.getFlag("midi-qol", "spellLevel");

                // create an item to do the damage, use the spirit guardians item and change everything that matters
                const itemData = mergeObject(theItem.toObject(), {
                    system: {
                        damage: { parts: [["3d8", damageType]] },
                        save: { ability: "wis", scale: "spell" },
                        components: {concentration: false},
                        target: {type: "creature", units: null, value: null},
                        range: {units: undefined},
                    }
                });
                const attackingItem = new CONFIG.Item.documentClass(itemData, { parent: theItem.parent });
                attackingItem.prepareData();
                attackingItem.prepareFinalAttributes();
                const targetUuids = targetsToAttack.map(tid => canvas.scene.tokens.get(tid).uuid)

                // specifying both the level and don't consume the spell slot causes the item to be rolled with the correct spell scaling
                await MidiQOL.completeItemUse(
                  attackingItem, 
                  {consumeSpellSlot: false, needsConfiguration: false, consumeSpellLevel: spellLevel}, 
                  { targetUuids, workflowOptions: {lateTargeting: "none"}, 
                });
                break;
        }
    whenMoved:
      asGM: false
      command: >+
        const api = game.modules.get("templatemacro").api;


        // wait for the movement to finish

        try {
          while (template.object.x !== this.coords.current.x || template.object.y !== this.coords.current.y) {
            await new Promise(resolve => setTimeout(resolve,100));
          }
        } catch(err) {}


        let contained;

        if (game.modules.get("walledtemplates")?.active)
          contained = template.object.targetsWithinShape().map(t => t.id);
        else
          contained = api.findContained(template);

        // remove immune targets from consideration

        const preSelected = getProperty(template,
        "flags.midi-qol.preSelectedTargets") ?? [];

        contained = contained.filter(tid => !preSelected.includes(tid));

        contained = contained.filter(tid =>
        MidiQOL.isTargetable(canvas.scene.tokens.get(tid)));


        // find tokens added/removed from the tokens inside the template

        const targets = template.getFlag("midi-qol", "targets")

        const targetsToRemove = targets.filter(tid => !contained.includes(tid));

        const targetsToAdd = contained.filter(tid => !targets.includes(tid))


        // Update the effects on the added/removed targets

        await template.callMacro("never", {template, action: "doEffects",
        targetsToRemove, targetsToAdd, userId: game.user.id});


        await template.setFlag("midi-qol", "targets", contained);

    whenEntered:
      asGM: false
      command: >+
        const preSelected = getProperty(template,
        "flags.midi-qol.preSelectedTargets") ?? [];

        // Don't include immune tokens

        if (preSelected.includes(token.id)) return;

        if (!MidiQOL.isTargetable(token)) return;


        // Check if token is inside walled templates template

        if (game.modules.get("walledtemplates")?.active 
            && !template.object.targetsWithinShape().map(t=>t.id).includes(token.id)) {
            console.log("entered ", token.id, "excluded")
            return;
        }


        let targets = await template.getFlag("midi-qol", "targets");

        if (targets.includes(token.id)) return; // already included


        // Add the token to targets, apply any effects and do the damage roll
        for the target  

        targets.push(token.id);

        await template.callMacro("never", {template, action: "doEffects",
        targetsToAdd: [token.id], userId: game.user.id});


        // record the targets in the template's range

        await template.setFlag("midi-qol", "targets", targets);


        if (game.combat.current.tokenId !== token.id) return; // Only when the
        token moved on its turn

        await template.callMacro("never", {template, action: "doAttack",
        targetsToAttack: [token.id], userId: game.user.id});

    whenLeft:
      asGM: false
      command: >
        // Just in case walled templates thinks the token is still inside the
        template - templates can wrap around walls?

        if (game.modules.get("walledtemplates")?.active 
            && template.object.targetsWithinShape().map(t=>t.id).includes(token.id)) {
         return;
        }


        let targets = await template.getFlag("midi-qol", "targets");

        if (!targets.includes(token.id)) return;


        // remove the effects from the token and remove it from the targets
        inside the template list

        await template.callMacro("never", {template, action: "doEffects",
        targetsToRemove: [token.id], userId: game.user.id});

        targets = targets.filter(tid => tid !== token.id);

        await template.setFlag("midi-qol", "targets", targets)
    whenTurnStart:
      asGM: false
      command: >-
        const preSelected = getProperty(template,
        "flags.midi-qol.preSelectedTargets") ?? [];

        // Don't include immune tokens

        if (preSelected.includes(token.id)) return;

        if (!MidiQOL.isTargetable(token)) return;


        // Check if token is inside walled templates template

        if (game.modules.get("walledtemplates")?.active 
            && !template.object.targetsWithinShape().map(t=>t.id).includes(token.id)) {
            return;
        }


        // Token started their turn inside the template - punish them

        await template.callMacro("never", {template, action: "doAttack",
        targetsToAttack: [token.id], userId: game.user.id});
    whenThrough:
      asGM: false
      command: >
        // Someone wandered through the template - thump them

        const preSelected = getProperty(template,
        "flags.midi-qol.preSelectedTargets") ?? [];

        if (preSelected.includes(token.id)) return;

        if (!MidiQOL.isTargetable(token)) return;


        if (game.combat.current.tokenId !== token.id) return; // Only when the
        token moved on its turn


        await template.callMacro("never", {template, action: "doAttack",
        targetsToAttack: 
         [token.id], userId: game.user.id});
    whenTurnEnd:
      asGM: false
      command: >-
        // If the effect/damage is applied on turn end then put the turn start
        code here instead
system:
  description:
    value: >-
      <p>You call forth spirits to protect you. They flit around you to a
      distance of 15 feet for the duration. If you are good or neutral, their
      spectral form appears angelic or fey (your choice). If you are evil, they
      appear fiendish.</p><p>When you cast this spell, you can designate any
      number of creatures you can see to be unaffected by it. An affected
      creature's speed is halved in the area, and when the creature enters the
      area for the first time on a turn or starts its turn there, it must make a
      Wisdom saving throw. On a failed save, the creature takes 3d8 radiant
      damage (if you are good or neutral) or 3d8 necrotic damage (if you are
      evil). On a successful save, the creature takes half as much
      damage.</p><p><strong>At Higher Levels.</strong> When you cast this spell
      using a spell slot of 4th level or higher, the damage increases by 1d8 for
      each slot level above 3rd.</p><p></p><p><strong>midi-qol:</strong>
      requires walled templates installed and set to auto target (to attach the
      template to the token) and template macros installed.</p><p>Version
      11.0.13</p>
