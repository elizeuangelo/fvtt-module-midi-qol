name: 'Metamagic: Twinned Spell'
type: feat
img: icons/magic/time/clock-stopwatch-white-blue.webp
effects: []
flags:
  itemacro:
    macro:
      name: 'Metamagic: Twinned Spell'
      type: script
      scope: global
      command: >-
        const points =
        actor.items.get(item.system.consume.target).system.uses.value;

        if (points === 0) {
            ui.notifications.warn("Not enough sorcery points to cast spell");
            return false;
        }

        const spellList = actor.items.filter(s=>
            s.type === "spell" 
            && s.system.target.type !== "self" 
            && s.system.target.value === 1
            && (s.system.preparation.mode !== "prepared" || s.system.preparation.prepared)
        );


        if (spellList.length === 0) return false;

        d = new Promise(resolve => {
            const buttons = {}
            spellList.forEach(s => {
                buttons[s.name] =  {
                    label: `
                        <div class="flexrow twinned-spell center" >
                             <div class="item-image"> <image src=${s.img} width="40" height="40" style="margin:0px"></div>
                            <div class="text">${s.name}</div>
                        </div>`,

                    callback: () => resolve(s.uuid)
                }
            });

            const style = `
            <style>
                .twinned-spell .dialog-buttons {
                    flex-direction: column;
                    gap: 2px;
                }
                .twinned-spell .center {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 40px;
                }
                .twinned-spell .text {
                    flex: 3 0 auto
                }
            </style>`;
            new Dialog({
                title: "Twinned Spell",
                content: style + "Choose a spell",
                buttons,
                close: () => resolve(undefined),
                default: spellList[0].name
            }, {width: 275, classes: ["dialog", "twinned-spell"]}).render(true);
        });

        const result = await d;

        if (!result) return false;

        const theSpell = (await fromUuid(result)).clone({"system.target.value":
        2}, {keepId: true});

        const consume = Math.max(1, theSpell.system.level);


        if (points < consume) {
            ui.notifications.warn("Not enough sorcery points to cast spell");
            return false;
        }

        item.system.consume.amount = consume;

        const hookId = Hooks.on("dnd5e.preUseItem", (hookItem, config, options)
        => {
            if (hookItem !== item) return;
            options.configureDialog = false;
            config.consumeResource = true;
            config.consumeResource = true;
            Hooks.off("dnd5e.preUseItem", hookId);
        });

        spellResult = await MidiQOL.completeItemRoll(theSpell);

        return spellResult ? true : false;
