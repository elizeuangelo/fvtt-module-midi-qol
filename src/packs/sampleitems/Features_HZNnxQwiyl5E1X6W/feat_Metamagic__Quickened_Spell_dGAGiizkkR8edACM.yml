  itemacro:
    macro:
      name: 'Metamagic: Quickened Spell'
      type: script
      img: icons/svg/dice-target.svg
      scope: global
      command: >-
        const points =
        actor.items.get(item.system.consume.target).system.uses.value;

        if (points < item.system.consume.amount) {
            ui.notifications.warn("Not enough sorcery points to quicken spell");
            return false;
        }

        const spellList = actor.items.filter(s=>
            s.type === "spell" && 
            s.system.activation.type === "action" 
            && s.system.activation.cost === 1
            && (s.system.preparation.mode !== "prepared" || s.system.preparation.prepared)
        );

        if (spellList.length === 0) return false;

        d = new Promise(resolve => {
            const buttons = {}
            spellList.forEach(s => {
                buttons[s.name] =  {
                    label: `
                        <div class="flexrow quicken-spell center" >
                             <div class="item-image"> <image src=${s.img} width="40" height="40" style="margin:0px"></div>
                            <div class="text">${s.name}</div>
                        </div>`,
                    callback: () => resolve(s.uuid)
                }
            });    const style = `
            <style>
                .quicken-spell .dialog-buttons {
                    flex-direction: column;
                    gap: 2px;
                }
                .quicken-spell .center {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 40px;
                }
                .quicken-spell .text {
                    flex: 3 0 auto
                }
            </style>`;
            new Dialog({
                title: "Quickened Spell",
                content: style + "Choose a spell",
                buttons,
                close: () => resolve(undefined),
                default: spellList[0].name
            },  {width: 320, classes: ["dialog", "quicken-spell"]}).render(true).render(true);
        });

        const result = await d;

        if (!result) return false;

        const theSpell = (await
        fromUuid(result)).clone({"system.activation.type": "bonus"}, {keepId:
        true});

        const hookId = Hooks.on("dnd5e.preUseItem", (hookItem, config, options)
        => {
            if (hookItem !== item) return;
            options.configureDialog = false;
            config.consumeResource = true;
            config.consumeResource = true;
            Hooks.off("dnd5e.preUseItem", hookId);
        });

        spellResult = await MidiQOL.completeItemRoll(theSpell);

        return spellResult ? true : false;
