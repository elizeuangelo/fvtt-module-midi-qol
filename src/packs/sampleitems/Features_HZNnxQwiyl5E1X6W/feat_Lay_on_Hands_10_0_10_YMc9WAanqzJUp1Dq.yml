system:
  description:
    value: "<p>Your blessed touch can heal wounds. You have a pool of healing power that replenishes when you take a long rest. With that pool, you can restore a total number of hit points equal to your paladin level × 5.\_</p>\n<p>As an action, you can touch a creature and draw power from the pool to restore a number of hit points to that creature, up to the maximum amount remaining in your pool.</p>\n<p>Alternatively, you can expend 5 hit points from your pool of healing to cure the target of one disease or neutralize one poison affecting it. You can cure multiple diseases and neutralize multiple poisons with a single use of Lay on Hands, expending hit points separately for each one.</p>\n<p>This feature has no effect on undead and constructs.<br /><br />Midi-qol notes: <br />Item has a passive effect to set the Lay on Hands resource pool to be 5 * the paladin level, default primary resource pool. <br /><br />When first equipped you <span style=\"text-decoration:underline\"><strong>must edit</strong></span> the Item and the resource consumption should be set the set to consume from the primary (default)\_ resource pool.<br /><br />You can change the resource pool by editing the passive effect and updating the item.</p>"
