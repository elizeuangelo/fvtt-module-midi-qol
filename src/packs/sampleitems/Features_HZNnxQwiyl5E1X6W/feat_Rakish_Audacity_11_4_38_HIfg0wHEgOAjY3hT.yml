flags:
  dae:
    activeEquipped: false
    alwaysActive: false
    macro:
      name: Rakish Audacity 10.0.33
      img: icons/skills/melee/strike-dagger-arcane-pink.webp
      type: script
      scope: global
      command: |-
        const version = "11.4.38";
        try {
            if (!["mwak","rwak"].includes(args[0].itemData.system.actionType)) return {}; // weapon attack
            if (args[0].hitTargets.length < 1) return;
            MidiQOL.warn(`Checking sneak attack for ${args[0].actor.name}`);
            if (args[0].itemData.system.actionType === "mwak" && !args[0].itemData.system.properties?.fin) return {}; // ranged or finesse
            token = canvas.tokens.get(args[0].tokenId);
            actor = token.actor;
            const rogueLevels = actor.getRollData().classes.rogue?.levels;
            if (!rogueLevels) {
              MidiQOL.warn("Sneak Attack Damage: Trying to do sneak attack and not a rogue");
              return {}; // rogue only
            }
            let target = canvas.tokens.get(args[0].hitTargets[0].id ?? args[0].hitTargers[0]._id);
            
            if (game.combat) {
              const combatTime = `${game.combat.id}-${game.combat.round + game.combat.turn /100}`;
              const lastTime = actor.getFlag("midi-qol", "sneakAttackTime");
              if (combatTime === lastTime) {
               MidiQOL.warn("Sneak Attack Damage: Already done a sneak attack this turn");
               return {};
              }
            }
            let isSneak = args[0].advantage;
            let foundEnemy = true; // used to flag if hostile or neutrals surround target
            if (!isSneak) {
              foundEnemy = false;
              let nearbyEnemy = canvas.tokens.placeables.filter(t => {
                let nearby = (t.actor &&
                     t.actor?.id !== args[0].actor._id && // not me
                     t.id !== target.id && // not the target
                     t.actor?.system.attributes?.hp?.value > 0 && // not incapacitated
                     t.document.disposition !== target.document.disposition && // not an ally
                     MidiQOL.getDistance(t, target, false) <= 5 // close to the target
                 );
            
                foundEnemy = foundEnemy || (nearby && t.document.disposition === -target.document.disposition)
                return nearby;
              });
              isSneak = nearbyEnemy.length>0;
            }
            if (!isSneak) {    // rakish audactity checkNearby
                let totalNearbyToMe = MidiQOL.findNearby(null, token, 5, 9).length;
                let distanceToTarget = MidiQOL.getDistance(target,token, false);
                const rakish = !args[0].disadvantage && totalNearbyToMe === 1 && distanceToTarget <= 5;
                if (rakish) {
                    foundEnemy = true; // don't display the neutrals warning
                    isSneak = true;
                }
            }
            if (!isSneak) {
                MidiQOL.warn(`${args[0].name} Not a sneak attack`);
                return {};
            }
            let useSneak = foundry.utils.getProperty(actor, "flags.dae.autoSneak");
            if (!useSneak) {
                let dialog = new Promise((resolve, reject) => {
                  new Dialog({
                  // localize this text
                  title: "Conditional Damage",
                  content: `<p>Use Rakish Audacity attack?</p>` + (!foundEnemy?"<p> Only Nuetral creatures nearby</p>":""),
                  buttons: {
                      one: {
                          icon: '<i class="fas fa-check"></i>',
                          label: "Confirm",
                          callback: () => resolve(true)
                      },
                      two: {
                          icon: '<i class="fas fa-times"></i>',
                          label: "Cancel",
                          callback: () => {resolve(false)}
                      }
                  },
                  default: "two"
                  }).render(true);
                });
                useSneak = await dialog;
            }
            if (!useSneak) return {}
            const baseDice = Math.ceil(rogueLevels/2);
            if (game.combat) {
              const combatTime = `${game.combat.id}-${game.combat.round + game.combat.turn /100}`;
              const lastTime = actor.getFlag("midi-qol", "sneakAttackTime");
              if (combatTime !== lastTime) {
                 await actor.setFlag("midi-qol", "sneakAttackTime", combatTime)
              }
            }
            const damageFormula = new CONFIG.Dice.DamageRoll(`${baseDice}d6`, {}, {
                critical: args[0].isCritical ?? false, 
                powerfulCritical: game.settings.get("dnd5e", "criticalDamageMaxDice"),
                multiplyNumeric: game.settings.get("dnd5e",  "criticalDamageModifiers")
            }).formula
            return {damageRoll: damageFormula, flavor: "Rakish Audacity"};

        }  catch (err) {
            console.error(`${args[0].itemData.name} - Rakish Audacity ${version}`, err);
        }
