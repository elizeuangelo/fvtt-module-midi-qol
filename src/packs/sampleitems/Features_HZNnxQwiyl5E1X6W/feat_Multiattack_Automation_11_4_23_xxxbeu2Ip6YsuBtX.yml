system:
  description:
    value: >-
      <p>For the lazy GM who finds clicking all of the attack buttons for
      creatures with multiattacks too tedious.<br /><br />Add the Multiattack
      Automation feat to your monster and then you can just click multiattack to
      unleash all of the attacks against a target.<br /><br />I've tested this
      on a dozen monsters and it seems to work, but there are bound to be cases
      it gets wrong if so please let me know.</p>
