  itemacro:
    macro:
      name: Shove
      type: script
      scope: global
      command: >-
        try {
            async function success(sourceToken, targetToken, results) {
            d = new Dialog({
                title: `${item.name} ${game.i18n.localize("midi-qol.save-success")}`,
                content: "what do you want to do?",
                buttons: {
                                move: {
                        icon: '<image src="icons/svg/direction.svg" width="30" height="30" style="border:0px">',
                        label: "Move",
                        callback: () => {MidiQOL.moveTokenAwayFromPoint(targetToken, 5, sourceToken.center)}
                    },
                    prone: {
                        icon: '<image src="icons/svg/falling.svg" width="30" height="30" style="border:0px">',
                        label: `${game.i18n.localize("EFFECT.StatusProne")}`,
                        callback: () => {
                            if (MidiQOL.hasCondition(targetToken, "Prone")) return;
                            let se = CONFIG.statusEffects.find(i => { // This will find a convenient effect
                                    if (i.statuses instanceof Set) return i.statuses.has("prone");
                                    return i.statuses?.find(s => s === "prone")
                                });
                                
                            if (!se) se = CONFIG.statusEffects.find(i => i.id === "prone"); // get the default status effect
                            targetToken.toggleEffect(se, {active: true});
                        }
                    }

                },
                default: "move"
            })
            d.render(true);
        }



        if (!token) token = MidiQOL.tokenForActor(actor);

        if (!token) {
            ui.notifications.warn(`${actor.name} does not have a token on the canvas`)
            return;
        }

        let target = workflow.targets?.first();

        if (!target ) {
            ui.Notificatons.warn(`${item.name} must have a token targeted`)
            return;
        }

        const tokenSize = token.actor.system.traits.size;

        const targetSize = target.actor.system.traits.size;

        const tokenSizeNum =
        Object.keys(CONFIG.DND5E.actorSizes).indexOf(tokenSize);

        const targetSizeNum =
        Object.keys(CONFIG.DND5E.actorSizes).indexOf(targetSize); 

        if (targetSizeNum - tokenSizeNum > 1) {
            ui.notifications.warn(`${item.name} creature size difference too great ${token.name}:${CONFIG.DND5E.actorSizes[tokenSize]} vs ${target.name}:${CONFIG.DND5E.actorSizes[targetSize]}`)
            return;
        }

        const targetSkill = target.actor.system.skills.ath.total >
        target.actor.system.skills.acr.total ? "ath" : "acr";

        await MidiQOL.contestedRoll({
            source: {token, rollType: "skill", ability: "Acrobatics"},
            target: {token: target, rollType: "skill", ability: targetSkill},
            flavor: item.name, success: success.bind(this, token, target), displayResults: true, itemCardId: workflow.itemCardId, 
            rollOptions: {fastForward: false, chatMessage: true, rollMode: "gmroll"}
        });

        } catch (err) {
            console.error(`${item.name} 11.0.7 item macro error`, err)
        }

        // A fun variant if the roll fails turn the tables and have the attacker
        pushed back/made prone

        /*

        await MidiQOL.contestedRoll({
            source: {token, rollType: "skill", ability: "Acrobatics"},
            target: {token: target, rollType: "skill", ability: targetSkill},
            flavor: item.name, success: success.bind(this, token, target), failure: success.bind(this, target, token) displayResults: true, itemCardId: workflow.itemCardId, 
            rollOptions: {fastForward: false, chatMessage: true}
        });

        */
