  dae:
    macro:
      name: Scalable weapon
      img: icons/magic/fire/dagger-rune-enchant-flame-purple.webp
      type: script
      scope: global
      command: |-
        try {
          const scaleFormula = rolledItem.system.scaling.formula;
          let parts = ["1d8", "force"];
          if (![undefined, ""].includes(scaleFormula)) {
            parts = rolledItem._scaleSpellDamage(parts, rolledItem.system.level, args[0].spellLevel, scaleFormula, actor.getRollData());
          }
          const attackBonus = 0;
          const item = {
            name: `${rolledItem.name} - Attack`,
            type: "weapon",
            img: rolledItem.img, 
            system : {
              actionType : "mwak",
              properties: ["mgc"],
              attackBonus: 0,
              proficient: true,
              damage: {
                parts: [parts],
              }
            }
          }
          const items = await actor.createEmbeddedDocuments("Item", [item]);
          const aes = await actor.createEmbeddedDocuments("ActiveEffect", [{
              name: `${rolledItem.name} - Attack`, 
              icon: rolledItem.img, 
              duration: {seconds: 60, rounds:10},
              "flags.dae.stackable": "noneName",
          }]);
          if (aes && items) await aes[0].addDependent(items[0])
        } catch (err) {
            console.error(`${rolledItem.name} - Macro`, err);
        }
