  itemacro:
    macro:
      data:
        _id: null
        name: Spiritual Weapon MQ0.9.58 + Warpgate
        type: script
        author: devnIbfBHb74U9Zv
        img: icons/svg/dice-target.svg
        scope: global
        command: >-
          const origin = args[0].itemUuid;

          if (origin) {
              const removeList = actor.effects.filter(ae => ae.data.origin === origin && getProperty(ae.data, "flags.dae.transfer") !== 3).map(ae=>ae.id);
              await actor.deleteEmbeddedDocuments("ActiveEffect", removeList)
          }

          const updates = {
              Item: {
              "Spiritual Weapon Attack": {
                "type": "weapon",
                "img": "systems/dnd5e/icons/spells/enchant-magenta-2.jpg", 
                "data.actionType" : "msak",
                "data.properties.mgc": true,
                "data.attackBonus": `${Number(args[0].actor.data.abilities[args[0].actor.data.attributes.spellcasting]?.mod) + Number(args[0].actor.data.attributes.prof) + Number(args[0].actor.data.bonuses.msak.attack)}`,
                "data.proficient": false,
                "data.damage.parts":[[`${1 + Math.floor((args[0].spellLevel-2)/2)}d8 + ${args[0].actor.data.abilities[args[0].actor.data.attributes.spellcasting]?.mod || ""}`,"force"]]
              }
            }
          }

          const result = await warpgate.spawn("Spiritual Weapon",  {embedded:
          updates}, {}, {});

          if (result.length !== 1) return;

          const createdToken = game.canvas.tokens.get(result[0]);

          await createdToken.actor.items.getName("Spiritual Weapon
          Attack").update({"data.proficient": false});

          const targetUuid = `Scene.${canvas.scene.id}.Token.${result[0]}`;


          await actor.createEmbeddedDocuments("ActiveEffect", [{
              label: "Summon", 
              icon: args[0].item.img, 
              origin,
              duration: {seconds: 60, rounds:10},
              "flags.dae.stackable": false,
              changes: [{key: "flags.dae.deleteUuid", mode: CONST.ACTIVE_EFFECT_MODES.ADD, value: [targetUuid]}]
          }]);
        folder: null
        sort: 0
        permission:
          default: 0
        flags: {}
      name: Spiritual Weapon MQ10.0.44 + Warpgate
      type: script
      img: icons/magic/fire/dagger-rune-enchant-flame-purple.webp
      scope: global
      command: |-
        const version = "10.0.13";
        try {
          const origin = args[0].itemUuid;
          if (origin) {
              const removeList = actor.effects.filter(ae => ae.origin === origin && getProperty(ae, "flags.dae.transfer") !== 3).map(ae=>ae.id);
              await actor.deleteEmbeddedDocuments("ActiveEffect", removeList)
          }
          const msakBonus = await new Roll(actor.system.bonuses.msak.attack ?? "0", actor.getRollData()).roll().total;
          const updates = {
              Item: {
              "Spiritual Weapon Attack": {
                "type": "weapon",
                "img": args[0].itemData.img, 
                "system.actionType" : "msak",
                "system.properties.mgc": true,
                "system.attackBonus": `${Number(actor.system.abilities[actor.system.attributes.spellcasting]?.mod) + Number(args[0].actor.system.attributes.prof) + msakBonus}`,
                "system.proficient": false,
                "system.damage.parts":[[`${1 + Math.floor((args[0].spellLevel-2)/2)}d8 + ${args[0].actor.system.abilities[args[0].actor.system.attributes.spellcasting]?.mod || ""}`,"force"]]
              }
            }
          }
          const result = await warpgate.spawn("Spiritual Weapon",  {embedded: updates}, {}, {});
          if (result.length !== 1) return;
          const createdToken = game.canvas.tokens.get(result[0]);
          await createdToken.actor.items.getName("Spiritual Weapon Attack").update({"data.proficient": false});
          const targetUuid = createdToken.document.uuid;

          await actor.createEmbeddedDocuments("ActiveEffect", [{
              label: "Summon", 
              icon: args[0].item.img, 
              origin,
              duration: {seconds: 60, rounds:10},
              "flags.dae.stackable": false,
              changes: [{key: "flags.dae.deleteUuid", mode: CONST.ACTIVE_EFFECT_MODES.ADD, value: [targetUuid]}]
          }]);
        } catch (err) {
            console.error(`${args[0].itemData.name} - Spiritual Weapon ${version}`, err);
        }
